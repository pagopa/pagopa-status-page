name: Deploy GitHub auth Function

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-function.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1f9a0c22da41e6ebfa534300ef656657ea2c6707

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies and test
        working-directory: functions
        run: |
          npm ci
          npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: deploy-github-auth-function-dev
      cancel-in-progress: false
    steps:
      - name: Validate deployment variables
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          : "${AZURE_CLIENT_ID:?Set AZURE_CLIENT_ID in the dev environment}"
          : "${AZURE_TENANT_ID:?Set AZURE_TENANT_ID in the dev environment}"
          : "${AZURE_SUBSCRIPTION_ID:?Set AZURE_SUBSCRIPTION_ID in the dev environment}"
          : "${AZURE_RESOURCE_GROUP:?Set AZURE_RESOURCE_GROUP in the dev environment}"
          : "${AZURE_FUNCTION_APP_NAME:?Set AZURE_FUNCTION_APP_NAME in the dev environment}"
          : "${GITHUB_TOKEN:?GITHUB_TOKEN is required to publish the image}"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish Function image
        env:
          IMAGE: ghcr.io/pagopa/pagopa-status-page
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file functions/Dockerfile \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/pagopa/pagopa-status-page" \
            --push \
            functions

      - name: Azure login with OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify existing Function App
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
        run: |
          az functionapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTION_APP_NAME" \
            --query id --output tsv

      - name: Restart Function App to pull the published image
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
        run: |
          az functionapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_FUNCTION_APP_NAME"
